[package]
name = "daedyx-sys"
version.workspace = true
description = "Betriebssystem-Aufrufe der Daedyx-Apps (einzige Stelle mit unsafe in daedyx/ui und Desk; aus Desk, Tasks T1b)"
edition.workspace = true
license.workspace = true
publish.workspace = true

[dependencies]
# Prüfsumme des Setups über den gesperrten Griff (Update U2, `install`); dieselbe Fassung wie `daedyx-update`.
sha2 = "0.11"

# Eigener Lint-Block (SICHERHEIT.md 2.1, Anhang A; Ausnahme A-019): unsafe nur je Funktion freigegeben und dokumentiert.
[lints.rust]
unsafe_code = "deny"
unused_must_use = "deny"

[lints.clippy]
unwrap_used = "deny"
expect_used = "deny"
panic = "deny"
unreachable = "deny"
todo = "deny"
unimplemented = "deny"
indexing_slicing = "deny"
string_slice = "deny"
get_unwrap = "deny"
print_stdout = "deny"
print_stderr = "deny"
dbg_macro = "deny"
# Wie der Workspace (Review T1b N-3): Rechnen und Umwandeln als Warnung, mit `-D warnings` also Fehler.
cast_possible_truncation = "warn"
cast_sign_loss = "warn"
arithmetic_side_effects = "warn"
undocumented_unsafe_blocks = "deny"
multiple_unsafe_ops_per_block = "deny"
mem_forget = "deny"
exit = "deny"
all = { level = "deny", priority = -1 }
