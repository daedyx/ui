[package]
name = "daedyx-sys"
version.workspace = true
description = "Betriebssystem-Aufrufe der Daedyx-Apps (einzige Stelle mit unsafe; aus Desk, Tasks T1b)"
edition.workspace = true
license.workspace = true
publish.workspace = true

# Eigener Lint-Block (SICHERHEIT.md 2.1, Anhang A; Ausnahme A-019): unsafe nur je Funktion freigegeben und dokumentiert.
[lints.rust]
unsafe_code = "deny"
unused_must_use = "deny"

[lints.clippy]
unwrap_used = "deny"
expect_used = "deny"
panic = "deny"
unreachable = "deny"
todo = "deny"
unimplemented = "deny"
indexing_slicing = "deny"
string_slice = "deny"
get_unwrap = "deny"
print_stdout = "deny"
print_stderr = "deny"
dbg_macro = "deny"
undocumented_unsafe_blocks = "deny"
multiple_unsafe_ops_per_block = "deny"
mem_forget = "deny"
exit = "deny"
all = { level = "deny", priority = -1 }
