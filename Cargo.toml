[workspace]
resolver = "3"
members = ["crates/daedyx-ui", "crates/daedyx-tasks-ui", "crates/daedyx-galerie"]

[workspace.package]
version = "0.1.0"
edition = "2024"
publish = false
license = "MIT"

# Versionen festgenagelt (egui wie im Launcher). Neue Abhängigkeit nur mit Eintrag in docs/ABHAENGIGKEITEN.md.
[workspace.dependencies]
eframe = { version = "=0.37.0", default-features = false, features = ["accesskit", "default_fonts", "glow"] }
egui_kittest = "=0.37.0"
serde = { version = "=1.0.229", features = ["derive"] }
serde_json = "=1.0.154"
tokio = { version = "=1.54.1", default-features = false, features = ["rt", "sync"] }
png = "=0.18.1"
# Für daedyx-tasks-ui (Tasks T1a), Fassungen wie in Desk und Tasks.
chrono = { version = "=0.4.45", default-features = false, features = ["std", "clock"] }
chrono-tz = "=0.10.4"
rusqlite = "=0.37.0"
# Aufgaben-Kern (privates Repository daedyx/core). Bis zum nächsten Kern-Tag der Stand von Zweig `paket-t1a`
# (Schnelleingabe aus Desk), danach per Tag.
daedyx-tasks-core = { git = "https://github.com/daedyx/core", rev = "4be4674d831dc86d9c645cd8a682635ce6693d06" }

# Sicherheitsrahmen (SICHERHEIT.md, Anhang A). Ändern nur mit Björns Ja.
[workspace.lints.rust]
unsafe_code = "forbid"
missing_debug_implementations = "allow"
unused_must_use = "deny"

[workspace.lints.clippy]
unwrap_used = "deny"
expect_used = "deny"
panic = "deny"
unreachable = "deny"
todo = "deny"
unimplemented = "deny"
indexing_slicing = "deny"
string_slice = "deny"
get_unwrap = "deny"
print_stdout = "deny"
print_stderr = "deny"
dbg_macro = "deny"
undocumented_unsafe_blocks = "deny"
multiple_unsafe_ops_per_block = "deny"
cast_possible_truncation = "warn"
cast_sign_loss = "warn"
arithmetic_side_effects = "warn"
mem_forget = "deny"
exit = "deny"
all = { level = "deny", priority = -1 }

[profile.release]
overflow-checks = true
debug = false
strip = "symbols"
